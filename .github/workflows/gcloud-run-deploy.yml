name: Build and deploy to Cloud Run

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: '${{ secrets.GCP_PROJECT }}'

      - name: Configure Docker auth
        run: |
          if [ -n "${{ secrets.ARTIFACT_REPOSITORY }}" ]; then
            gcloud auth configure-docker ${GCP_REGION:-us-central1}-docker.pkg.dev --quiet
          else
            gcloud auth configure-docker --quiet
          fi

      - name: Build and push container
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          ARTIFACT_REPOSITORY: ${{ secrets.ARTIFACT_REPOSITORY }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          SHA=${{ github.sha }}
          if [ -n "$ARTIFACT_REPOSITORY" ]; then
            IMAGE=${GCP_REGION:-us-central1}-docker.pkg.dev/$GCP_PROJECT/$ARTIFACT_REPOSITORY/recallai:$SHA
          else
            IMAGE=gcr.io/$GCP_PROJECT/recallai:$SHA
          fi
          echo "Building $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          ARTIFACT_REPOSITORY: ${{ secrets.ARTIFACT_REPOSITORY }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          SHA=${{ github.sha }}
          if [ -n "$ARTIFACT_REPOSITORY" ]; then
            IMAGE=${GCP_REGION:-us-central1}-docker.pkg.dev/$GCP_PROJECT/$ARTIFACT_REPOSITORY/recallai:$SHA
          else
            IMAGE=gcr.io/$GCP_PROJECT/recallai:$SHA
          fi
          echo "Deploying $IMAGE to Cloud Run"
          gcloud run deploy recallai-service --image=$IMAGE --region=${GCP_REGION:-us-central1} --platform=managed --allow-unauthenticated
