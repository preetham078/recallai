<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Chat AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p class="eyebrow">AI APP WITH MEMORY</p>
        <h1>Talk with your assistant and keep every user conversation saved.</h1>
        <p class="subtitle">
          Create a user profile, chat naturally, and reload the conversation
          history whenever the same user returns.
        </p>
      </section>

      <section class="card setup-card">
        <form id="user-form" class="user-form">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" placeholder="Priya" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="priya@example.com"
              required
            />
          </div>
          <button type="submit">Create or Load User</button>
        </form>
        <p id="user-status" class="status"></p>
      </section>

      <section class="card chat-card">
        <div class="chat-header">
          <div>
            <h2>Conversation</h2>
            <p id="chat-meta">No active user yet.</p>
          </div>
          <span id="api-status" class="pill">Checking AI status...</span>
        </div>

        <div id="messages" class="messages"></div>

        <form id="chat-form" class="chat-form">
          <textarea
            id="message"
            name="message"
            rows="3"
            placeholder="Ask something..."
            required
          ></textarea>
          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
