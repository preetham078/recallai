<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PingMe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=profile-1" />
  </head>
  <body>
    <main class="messenger-shell">
      <aside class="sidebar">
        <div class="mobile-topbar" aria-label="Mobile app bar">
          <h1>WhatsChat</h1>
          <div class="topbar-actions">
            <button id="top-search-button" class="icon-search-button" type="button" aria-label="Add friends">
              <span class="icon-search"></span>
            </button>
            <button id="open-profile-button" class="icon-menu-button-top" type="button" aria-label="Open profile">
              <span class="icon-menu"></span>
            </button>
          </div>
        </div>
        <div class="wa-tabs" aria-label="Messaging sections">
          <button id="tab-chats" class="active" type="button" data-people-tab="chats">Chats</button>
          <button id="tab-requests" type="button" data-people-tab="requests">Requests</button>
          <button id="tab-add-friends" type="button" data-people-tab="add">Add Friends</button>
        </div>

        <div class="brand-row">
          <div class="brand-mark">P</div>
          <div>
            <h1>WhatsChat</h1>
            <p>Username messaging</p>
          </div>
        </div>

        <section id="auth-panel" class="auth-panel">
          <div class="tabs" role="tablist" aria-label="Account actions">
            <button id="show-signup" class="tab active" type="button">
              Sign up
            </button>
            <button id="show-login" class="tab" type="button">Log in</button>
          </div>

          <form id="signup-form" class="auth-form">
            <label>
              Name
              <input name="displayName" placeholder="Your name" required />
            </label>
            <label>
              Username
              <input
                name="username"
                placeholder="username"
                autocomplete="username"
                required
              />
            </label>
            <label>
              Password
              <input
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="4"
                required
              />
            </label>
            <label>
              Bio
              <input name="bio" placeholder="Coffee, code, late replies" />
            </label>
            <button type="submit">Create account</button>
          </form>

          <form id="login-form" class="auth-form hidden">
            <label>
              Username
              <input
                name="username"
                placeholder="username"
                autocomplete="username"
                required
              />
            </label>
            <label>
              Password
              <input
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </label>
            <button type="submit">Log in</button>
          </form>
        </section>

        <section id="profile-panel" class="profile-panel hidden" aria-hidden="true">
          <div class="mobile-profile-top">
            <h2 id="mobile-profile-username">@username</h2>
            <button id="close-profile-button" class="icon-menu-button" type="button" aria-label="Back to chats">
              <span></span>
            </button>
          </div>
          <div class="profile-card">
            <div id="profile-avatar" class="avatar">P</div>
            <div>
              <h2 id="profile-name">Profile</h2>
              <p id="profile-username">@username</p>
              <p id="profile-bio" class="profile-bio"></p>
            </div>
          </div>
          <div class="profile-meta">
            <span id="profile-joined">Joined today</span>
          </div>
          <div class="profile-stats" aria-label="Profile stats">
            <div><strong id="profile-friends">0</strong><span>friends</span></div>
            <div><strong id="profile-chats">0</strong><span>chats</span></div>
            <div><strong id="profile-messages">0</strong><span>messages</span></div>
          </div>
          <div class="profile-actions">
            <button id="edit-profile-button" type="button">Edit profile</button>
            <button id="share-profile-button" type="button">Share profile</button>
          </div>
          <form id="profile-form" class="profile-form hidden">
            <label>
              Name
              <input id="profile-display-name-input" name="displayName" required />
            </label>
            <label>
              Bio
              <textarea id="profile-bio-input" name="bio" maxlength="160" rows="3"></textarea>
            </label>
            <div class="profile-form-actions">
              <button type="submit">Save</button>
              <button id="cancel-profile-edit-button" type="button">Cancel</button>
            </div>
          </form>
          <button id="logout-button" class="ghost-button" type="button">
            Log out
          </button>
        </section>

        <section id="people-panel" class="people-panel hidden">
          <div id="chats-section" class="people-section" data-section="chats">
            <h2 class="section-title">Chats</h2>
            <div id="inbox-list" class="people-list"></div>
          </div>
          <div id="requests-section" class="people-section" data-section="requests">
            <h2 class="section-title">Friend requests</h2>
            <div id="requests-list" class="people-list"></div>
          </div>
          <div id="add-friends-section" class="people-section" data-section="add">
            <label class="search-label">
              Add friends by username
              <input id="search-input" placeholder="Search @username" />
            </label>
            <div id="people-list" class="people-list"></div>
          </div>
        </section>
      </aside>

      <section class="chat-area">
        <header class="chat-header">
          <button id="back-button" class="back-button" type="button" aria-label="Back to chats">
            <span aria-hidden="true"></span>
          </button>
          <div id="chat-avatar" class="avatar muted">?</div>
          <div>
            <h2 id="chat-title">Choose someone to message</h2>
            <p id="chat-subtitle">Create an account, search a username, then start texting.</p>
          </div>
        </header>

        <div id="messages" class="messages">
          <div class="empty-state">Your messages will appear here.</div>
        </div>

        <form id="message-form" class="message-form">
          <input
            id="message-input"
            placeholder="Type a message"
            autocomplete="off"
            disabled
          />
          <button id="send-button" type="submit" disabled>Send</button>
        </form>
        <p id="status" class="status"></p>
      </section>

      <nav class="bottom-nav" aria-label="Mobile navigation" aria-hidden="true">
        <button id="nav-home" type="button" aria-label="Home"><span class="nav-home"></span></button>
        <button id="nav-search" type="button" aria-label="Search"><span class="nav-search"></span></button>
        <button id="nav-create" type="button" aria-label="Create"><span class="nav-create"></span></button>
        <button id="nav-messages" class="active" type="button" aria-label="Messages"><span class="nav-message"></span></button>
        <button id="nav-profile" type="button" aria-label="Profile"><span class="nav-profile"></span></button>
      </nav>
      <button id="floating-compose" class="floating-compose" type="button" aria-label="Start chat">
        <span></span>
      </button>
    </main>

    <script src="./config.js"></script>
    <script src="./app.js?v=sections-1"></script>
  </body>
</html>
